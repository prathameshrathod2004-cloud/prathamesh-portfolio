{% extends "base.html" %}
{% block title %}Contact | Prathamesh Rathod{% endblock %}

{% block content %}

<section class="page-header" data-aos="fade-up">
  <p class="tag">Get In Touch</p>
  <h1>Contact Me</h1>
  <p class="page-sub">Have a shoot or edit in mind? Let's talk.</p>
</section>

<section class="contact-section">
  <div class="contact-grid">

    <div class="contact-info" data-aos="fade-right">
      <a href="https://wa.me/918080602746" target="_blank" class="contact-item">
        <i class="fa-brands fa-whatsapp"></i>
        <div>
          <h4>WhatsApp</h4>
          <p>+91 8080602746</p>
        </div>
      </a>

      <a href="tel:8080602746" class="contact-item">
        <i class="fa-solid fa-phone"></i>
        <div>
          <h4>Phone</h4>
          <p>8080602746</p>
        </div>
      </a>

      <a href="https://www.instagram.com/itz_pratya_official" target="_blank" class="contact-item">
        <i class="fa-brands fa-instagram"></i>
        <div>
          <h4>Instagram</h4>
          <p>@itz_pratya_official</p>
        </div>
      </a>
    </div>

    <form class="contact-form" method="POST" data-aos="fade-left">
      <div class="form-group">
        <input type="text" name="name" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Your Email (optional)">
      </div>
      <div class="form-group">
        <input type="tel" name="phone" placeholder="Your Phone (optional)">
      </div>
      <div class="form-group">
        <textarea name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send Message</button>
    </form>

  </div>
</section>

{% endblock %}
